name: GhosttyNextKit (ghostty-next)

# Builds GhosttyNextKit.xcframework for the cmux iOS app on a remote macOS
# runner, never on a developer Mac. A push to main or to a release/*
# branch publishes the release `xcframework-<sha>-<flavor>` with a
# deterministic zip, SHA256SUMS, manifest.json and a build provenance
# attestation. Pull requests build and upload a workflow artifact only.

on:
  push:
    # release/*: a fix release on an older base (an embedder's pinned
    # commit plus only the fix), so a pin never has to take unrelated
    # main changes to get a fix. It is never marked the latest release.
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release for this commit (main or release/* only)"
        type: boolean
        default: false
      verify_reproducible:
        description: "Build a second time on another runner and compare slice hashes"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Release rules (next/release_plan.py): skip when no build input changed
  # since the newest ancestor release; a label (<flavor>+<sha12>) and tag are
  # never reused, and an existing tag refuses the publish.
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      label: ${{ steps.plan.outputs.label }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Release rule tests
        run: python3 -m unittest next/test_release_plan.py
      - name: Release plan
        id: plan
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . next/toolchain.env
          python3 next/release_plan.py --repo . --head "$GITHUB_SHA" \
            --flavor "$GHOSTTYKIT_FLAVOR" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: >-
      github.event_name != 'push' || needs.plan.outputs.publish == 'true'
    runs-on: ${{ vars.GHOSTTY_NEXT_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    outputs:
      archive_sha256: ${{ steps.pkg.outputs.archive_sha256 }}
      release_tag: ${{ steps.pkg.outputs.release_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-pkg-${{ hashFiles('build.zig.zon', 'build.zig.zon.json', 'next/toolchain.env') }}
          restore-keys: zig-pkg-

      # Unit tests for the ghostty-next patches. They run before the
      # GhosttyNextKit build so a red patch fails fast. Add a filter when a
      # patch adds tests.
      - name: Patch unit tests
        run: |
          set -euo pipefail
          source next/toolchain.env
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          zig="$(next/install-zig.sh | tail -n 1)"
          zig_dir="$(dirname "$zig")"
          export PATH="$zig_dir:$PATH"
          sysctl -n machdep.cpu.brand_string || true
          zig build test \
            -Dapp-runtime=none \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Dtest-filter="reflow preview: " \
            --summary all
          zig build \
            -Demit-bench \
            -Dapp-runtime=none \
            -Demit-macos-app=false \
            -Dsentry=false
          for i in 1 2 3; do ./zig-out/bin/ghostty-bench +reflow-preview; done
          ./zig-out/bin/ghostty-bench +reflow-preview --terminal-cols=300 --terminal-rows=80 --fill-lines=20000

