name: GhosttyNextKit (ghostty-next)

# Builds GhosttyNextKit.xcframework for the cmux iOS app on a remote macOS
# runner, never on a developer Mac. A push to main publishes the release
# `xcframework-<sha>-<flavor>` with a deterministic zip, SHA256SUMS,
# manifest.json and a build provenance attestation. Pull requests build
# and upload a workflow artifact only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release for this commit (main only)"
        type: boolean
        default: false
      verify_reproducible:
        description: "Build a second time on another runner and compare slice hashes"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Release rules (next/release_plan.py): skip when no build input changed
  # since the newest ancestor release; a label (<flavor>+<sha12>) and tag are
  # never reused, and an existing tag refuses the publish.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      label: ${{ steps.plan.outputs.label }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Release rule tests
        run: python3 -m unittest next/test_release_plan.py
      - name: Release plan
        id: plan
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . next/toolchain.env
          python3 next/release_plan.py --repo . --head "$GITHUB_SHA" \
            --flavor "$GHOSTTYKIT_FLAVOR" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: >-
      github.event_name != 'push' || needs.plan.outputs.publish == 'true'
    runs-on: ${{ vars.GHOSTTY_NEXT_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    outputs:
      archive_sha256: ${{ steps.pkg.outputs.archive_sha256 }}
      release_tag: ${{ steps.pkg.outputs.release_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-pkg-${{ hashFiles('build.zig.zon', 'build.zig.zon.json', 'next/toolchain.env') }}
          restore-keys: zig-pkg-

      # Unit tests for the ghostty-next patches. They run before the
      # GhosttyNextKit build so a red patch fails fast. Add a filter when a
      # patch adds tests.
      - name: Patch unit tests
        run: |
          set -euo pipefail
          source next/toolchain.env
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          zig="$(next/install-zig.sh | tail -n 1)"
          zig_dir="$(dirname "$zig")"
          export PATH="$zig_dir:$PATH"
          zig build test \
            -Dapp-runtime=none \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Dtest-filter="manual: " \
            -Dtest-filter="terminal responses: " \
            -Dtest-filter="ghostty.h SurfaceIoMode" \
            -Dtest-filter="ghostty.h surface config IO fields" \
            -Dtest-filter="encode committed text" \
            -Dtest-filter="OSC 7: manual surfaces keep the raw URL" \
            -Dtest-filter="osc7Path decodes" \
            -Dtest-filter="cell offsets" \
            -Dtest-filter="kittygfx display clamps cell offsets" \
            -Dtest-filter="report associated text produced by consumed alt" \
            -Dtest-filter="ghostty.h surface grid" \
            -Dtest-filter="ghostty.h SurfaceSnapshotPhase" \
            -Dtest-filter="renderer mailbox: " \
            -Dtest-filter="loadString " \
            -Dtest-filter="c_get: window-padding" \
            -Dtest-filter="font size action event" \
            -Dtest-filter="grid metrics " \
            -Dtest-filter="bounded clipboard: " \
            --summary all
          # libghostty-vt patches (VT replay formatter, terminal and Kitty
          # graphics C API). These live in the lib-vt test modules.
          zig build test-lib-vt \
            -Dtest-filter="Terminal vt restores cursor" \
            -Dtest-filter="Terminal vt clamps an outside origin cursor" \
            -Dtest-filter="Terminal vt cursor is absolute when origin mode is omitted" \
            -Dtest-filter="Terminal vt cursor uses default margins" \
            -Dtest-filter="Terminal vt trailing blank rows" \
            -Dtest-filter="Page vt preserved trailing blank rows" \
            -Dtest-filter="Page VT preserves a fully styled blank row" \
            -Dtest-filter="Page VT unstyled blank cells" \
            -Dtest-filter="render: OSC dynamic color resets" \
            -Dtest-filter="get cursor visual" \
            -Dtest-filter="cursor activity" \
            -Dtest-filter="count limit" \
            -Dtest-filter="kitty graphics dirty state" \
            -Dtest-filter="placement iterator exposes internal" \
            -Dtest-filter="image_get_handle_by_number" \
            -Dtest-filter="image_set_number" \
            -Dtest-filter="image iterator visits" \
            -Dtest-filter="image ID cursor" \
            -Dtest-filter="Kitty automatic image ID cursors" \
            -Dtest-filter="RIS preserves configured byte and count limits" \
            -Dtest-filter="cell offsets" \
            -Dtest-filter="kittygfx display clamps cell offsets" \
            -Dtest-filter="placement_pixel_size keeps the c/r size with cell offsets" \
            -Dtest-filter="report associated text produced by consumed alt" \
            -Dtest-filter="select word on a wrapped" \
            -Dtest-filter="select word ending in a wide glyph" \
            -Dtest-filter="Terminal vt restores pending wrap with origin mode" \
            -Dtest-filter="Terminal vt selection after earlier rows keeps its rows with tabstops" \
            -Dtest-filter="Terminal vt with tabstops" \
            --summary all

      - name: Build and package
        id: pkg
        run: |
          set -euo pipefail
          next/build-xcframework.sh "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/pkg.log"
          result="$(tail -n 1 "$RUNNER_TEMP/pkg.log")"
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); print("archive_sha256=" + r["archive_sha256"]); print("release_tag=" + r["release_tag"])' "$result" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/out/SHA256SUMS"
          cat "$RUNNER_TEMP/out/manifest.json"

      - name: Link and run smoke
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . next/toolchain.env
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          next/smoke.sh --xcframework macos/GhosttyNextKit.xcframework

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghosttykit-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14

  reproduce:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_reproducible
    needs: build
    runs-on: ${{ vars.GHOSTTY_NEXT_MACOS_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ghosttykit-${{ github.sha }}
          path: ${{ runner.temp }}/first
      - name: Rebuild without caches and compare
        run: |
          set -euo pipefail
          rm -rf ~/.cache/zig .zig-cache
          next/build-xcframework.sh "$RUNNER_TEMP/second"
          slices() { python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); [print(s["identifier"], s["sha256"]) for s in m["slices"]]' "$1"; }
          archive() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"]["sha256"])' "$1"; }
          diff -u <(slices "$RUNNER_TEMP/first/manifest.json") <(slices "$RUNNER_TEMP/second/manifest.json")
          a="$(archive "$RUNNER_TEMP/first/manifest.json")"
          b="$(archive "$RUNNER_TEMP/second/manifest.json")"
          echo "archive first=$a second=$b"
          [ "$a" = "$b" ]

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ghosttykit-${{ github.sha }}
          path: out
      - name: Verify checksums
        run: |
          set -euo pipefail
          cd out && sha256sum -c SHA256SUMS
          test "$(sha256sum GhosttyNextKit.xcframework.zip | cut -d' ' -f1)" = "${{ needs.build.outputs.archive_sha256 }}"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: out/GhosttyNextKit.xcframework.zip
      - name: Create release (a tag and label are never reused)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          PLAN_TAG: ${{ needs.plan.outputs.tag }}
          LABEL: ${{ needs.plan.outputs.label }}
          SUM: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test "$TAG" = "$PLAN_TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; a label is never reused, refusing to publish"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GhosttyNextKit $LABEL" \
            --notes "GhosttyNextKit.xcframework, label $LABEL, for ghostty-next $GITHUB_SHA. sha256 (also the SwiftPM checksum): $SUM. Pin by URL and sha256. Toolchain and slice hashes: manifest.json." \
            out/GhosttyNextKit.xcframework.zip out/SHA256SUMS out/manifest.json
